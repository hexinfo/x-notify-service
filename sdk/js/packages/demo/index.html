<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>x-notify-service SDK 演示</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 560px; margin: 32px auto; padding: 0 16px; }
      fieldset { margin-bottom: 16px; }
      label { display: block; margin: 8px 0 4px; }
      input, button { padding: 6px 10px; font-size: 14px; }
      button { margin-right: 8px; cursor: pointer; }
      #log { background: #f5f5f5; padding: 12px; min-height: 120px; font-size: 12px; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <h2>x-notify-service SDK 演示</h2>

    <fieldset>
      <legend>服务</legend>
      <button type="button" id="btn-discover">探测服务</button>
      <button type="button" id="btn-launch">协议拉起</button>
      <span id="status">未知</span>
    </fieldset>

    <fieldset>
      <legend>通知</legend>
      <label>标题 <input id="inp-title" value="工单提醒" size="24" /></label>
      <label>正文(Markdown；例如 **加粗**，链接不跳转、图片不加载) <input id="inp-body" size="44" value="待办通知 **1** 条 15:21:05" /></label>
      <label>宽度(220-800,留空用默认) <input id="inp-width" size="6" inputmode="numeric" placeholder="220" /></label>
      <label>高度(80-600,留空用默认) <input id="inp-height" size="6" inputmode="numeric" placeholder="100" /></label>
      <label>标题背景色 <input id="inp-header-bg" value="#273449" /></label>
      <label>标题文字色 <input id="inp-header-text" value="#FFFFFF" /></label>
      <label>正文背景色 <input id="inp-body-bg" value="#F7F9FC" /></label>
      <label>正文文字色 <input id="inp-body-text" value="#3F4754" /></label>
      <button type="button" id="btn-send">发送</button>
    </fieldset>

    <fieldset>
      <legend>日志</legend>
      <div id="log"></div>
    </fieldset>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
