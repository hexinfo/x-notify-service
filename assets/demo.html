<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>x-notify-service 演示</title>
    <style>
      body { font-family: system-ui, -apple-system, sans-serif; max-width: 580px; margin: 32px auto; padding: 0 16px; color: #1f2329; }
      h2 { margin-bottom: 4px; }
      fieldset { margin-bottom:  16px; border: 1px solid #e4e6eb; border-radius: 8px; }
      label { display: block; margin: 8px 0 4px; font-size: 14px; }
      input { padding: 6px 10px; font-size: 14px; width: 92%; box-sizing: border-box; }
      button { padding: 6px 14px; font-size: 14px; margin: 8px 8px 0 0; cursor: pointer; border: 1px solid #d0d3d9; background: #fff; border-radius: 6px; }
      button.primary { background: #4c8dff; border-color: #4c8dff; color: #fff; }
      #log { background: #f5f6f8; padding: 12px; min-height: 100px; font-size: 12px; white-space: pre-wrap; border-radius: 6px; font-family: ui-monospace, monospace; }
    </style>
  </head>
  <body>
    <h2>x-notify-service 演示页</h2>

    <fieldset>
      <legend>服务</legend>
      <span id="status">检测中…</span>
    </fieldset>

    <fieldset>
      <legend>通知</legend>
      <label>标题 <input id="inp-title" value="工单提醒" /></label>
      <label>正文(Markdown；例如 **加粗**，链接不跳转、图片不加载)<input id="inp-body" value="待办通知 **1** 条 15:21:05" /></label>
      <label>宽度(220-800,留空用默认)<input id="inp-width" inputmode="numeric" placeholder="220" /></label>
      <label>高度(80-600,留空用默认)<input id="inp-height" inputmode="numeric" placeholder="100" /></label>
      <label>标题背景色<input id="inp-header-bg" value="#273449" /></label>
      <label>标题文字色<input id="inp-header-text" value="#FFFFFF" /></label>
      <label>正文背景色<input id="inp-body-bg" value="#F7F9FC" /></label>
      <label>正文文字色<input id="inp-body-text" value="#3F4754" /></label>
      <button type="button" class="primary" id="btn-send">发送通知</button>
      <button type="button" id="btn-launch">拉起服务</button>
      <button type="button" id="btn-close">关闭弹窗</button>
    </fieldset>

    <fieldset>
      <legend>日志</legend>
      <div id="log"></div>
    </fieldset>

    <script type="module">
      import { createNotifyService } from './sdk.js'

      const svc = createNotifyService()
      const log = (msg) => {
        const t = new Date().toTimeString().slice(0, 8)
        document.getElementById('log').textContent += `[${t}] ${msg}\n`
      }
      const setStatus = (text) => {
        document.getElementById('status').textContent = text
      }

      svc.start().then((ok) => setStatus(ok ? '在线' : '未安装/未运行'))

      document.getElementById('btn-send').onclick = async () => {
        const title = document.getElementById('inp-title').value
        const body = document.getElementById('inp-body').value
        // 宽高与颜色可选:留空不传字段(走服务端默认)
        const opts = { title, body }
        const w = document.getElementById('inp-width').value.trim()
        const h = document.getElementById('inp-height').value.trim()
        if (w !== '') opts.width = Number(w)
        if (h !== '') opts.height = Number(h)
        for (const [field, id] of [
          ['headerBackgroundColor', 'inp-header-bg'],
          ['headerTextColor', 'inp-header-text'],
          ['bodyBackgroundColor', 'inp-body-bg'],
          ['bodyTextColor', 'inp-body-text'],
        ]) {
          const value = document.getElementById(id).value.trim()
          if (value !== '') opts[field] = value
        }
        const r = await svc.notify(opts)
        log(r.ok ? `发送成功: via=${r.via}` : '未送达(服务未运行,静默失败)')
      }
      document.getElementById('btn-launch').onclick = async () => {
        log((await svc.start(10000)) ? '服务已就绪' : '拉起失败(未安装或超时)')
      }
      document.getElementById('btn-close').onclick = async () => {
        await svc.close()
        log('已关闭弹窗')
      }
    </script>
  </body>
</html>
