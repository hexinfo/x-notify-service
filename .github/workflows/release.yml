# Release:打 v* 标签 → 三平台打包 → 发布到 GitHub Releases
# 正式发版流程:测试由 ci.yml 在 main 上把关,这里只做打包与发布
#
# 产物:Linux tar.xz(x86_64/aarch64)+ Windows NSIS setup.exe
# 说明:Linux 在 Debian 10 容器内编译(glibc 2.28 地板,兼容 UOS 20/麒麟 V10
#       等老 glibc 系统,产出可跑在 ≥2.28 的所有发行版);脚本自带 GLIBC 断言。
#       linux-aarch64 使用 GitHub 原生 arm64 runner(公开仓库免费)

name: release

on:
  push:
    tags: ['v*']
  # 手动干跑:走完整打包与冒烟,但不发布(publish 仅 tag 推送触发)
  workflow_dispatch:

# 最小权限基线:publish job 覆盖为 contents: write
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  linux-x86_64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      # 试验:target/release 单独缓存(缩小范围避免全量 target 的 tar 失败)
      - uses: actions/cache@v4
        id: cargo-home
        with:
          path: .ci-cache
          key: linux-x86_64-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: linux-x86_64-cargo-
      - uses: actions/cache@v4
        id: target-release
        with:
          path: target/linux-x86_64
          key: linux-x86_64-target-${{ hashFiles('Cargo.lock') }}
          restore-keys: linux-x86_64-target-
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm install -g pnpm@10
      - run: ./scripts/pack-linux.sh x86_64
      - run: sh scripts/ci/test-install-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64-tarxz
          path: dist/*.tar.xz

  linux-aarch64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v4
        with:
          path: |
            .ci-cache
            target
          key: linux-aarch64-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: linux-aarch64-cargo-
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm install -g pnpm@10
      - run: ./scripts/pack-linux.sh aarch64
      - run: sh scripts/ci/test-install-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-aarch64-tarxz
          path: dist/*.tar.xz

  windows:
    # 原生 Windows 编译机:MSVC 一等工具链(rc.exe 嵌图标零配置),
    # 且产物可在构建机真实冒烟(交叉编译做不到);公开仓库 runner 免费
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      # rust-cache 默认缓存 cargo 注册表 + target/(全量增量,与 Linux 手工对齐)
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          shared-key: release-windows-msvc
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm install -g pnpm@10
      # windows-latest 不预装 NSIS:choco 安装(setup.exe 打包器)并注入 PATH
      - run: choco install nsis -y --no-progress && echo "C:\Program Files (x86)\NSIS" >> $GITHUB_PATH
        shell: bash
      - run: bash scripts/pack-windows.sh x86_64-pc-windows-msvc
        shell: bash
      - shell: pwsh
        run: |
          $setup = Get-ChildItem dist/*-windows-x86_64-setup.exe | Select-Object -First 1
          & ./scripts/ci/test-windows-clean-upgrade.ps1 -Setup $setup.FullName -ServiceExe ./target/x86_64-pc-windows-msvc/release/x-notify-service.exe
      # 产物冒烟:GUI 子系统经 AttachConsole 回显到本控制台
      - run: |
          ./target/x86_64-pc-windows-msvc/release/x-notify-service.exe --version
          ./target/x86_64-pc-windows-msvc/release/x-notify-service.exe info | head -5
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: windows-setup-exe
          path: dist/*.exe

  publish:
    needs: [linux-x86_64, linux-aarch64, windows]
    # 仅 tag 推送才发布;workflow_dispatch 干跑不碰 Releases
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - run: |
          TAG="${GITHUB_REF#refs/tags/}"
          # 已发布(tag 不可变):拒绝覆盖;草稿(上次中断):续传;不存在:新建草稿
          STATE=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null || echo none)
          if [ "$STATE" = "false" ]; then
            echo "::error::Release $TAG 已发布,拒绝覆盖——标签不可变,变更请升版本号打新 tag"
            exit 1
          fi
          if [ "$STATE" = "none" ]; then
            gh release create "$TAG" --draft \
            --title "x-notify-service $TAG" \
            --notes "正式发布 $TAG · commit ${GITHUB_SHA::8} · $(date -u '+%Y-%m-%d %H:%M UTC')

          #### 产物
          - Linux x86_64 / aarch64: tar.xz 绿色版(解压后 ./install.sh,免 root)
          - Windows: setup.exe(per-user 免 UAC)

          #### 验证
          \`\`\`bash
          md5sum bin/x-notify-service   # 与 Release 说明或下发渠道核对
          x-notify-service info         # 诊断快照(工作区/落点/注册状态)
          x-notify-service notify -t \"手测\"
          \`\`\`
          安装与接入见包内 sdk-使用手册.md。" \
            -R "$GITHUB_REPOSITORY" \
              dist/*.tar.xz dist/*.exe
          else
            gh release upload "$TAG" dist/*.tar.xz dist/*.exe --clobber -R "$GITHUB_REPOSITORY"
          fi
          # -R 必带:本 job 无 checkout,gh 回退用 git 查仓库必失败
          gh release edit "$TAG" --draft=false -R "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
